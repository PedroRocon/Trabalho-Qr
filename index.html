<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Refeições</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<h1>🍽 Controle de Refeições</h1>

<div id="reader" style="width:300px;"></div>

<h2 id="resultado">Aguardando leitura...</h2>

<script>
let registros = {};

function onScanSuccess(decodedText) {
    try {
        let data = JSON.parse(decodedText);
        let matricula = data.MatriculaAluno;

        if (!registros[matricula]) {
            registros[matricula] = 0;
        }

        registros[matricula]++;

        let status = registros[matricula] > 2 ? "BLOQUEADO ❌" : "LIBERADO ✅";

        document.getElementById("resultado").innerText =
            "Matrícula: " + matricula +
            " | Refeições: " + registros[matricula] +
            " | Status: " + status;

    } catch (e) {
        document.getElementById("resultado").innerText = "QR inválido";
    }
}

let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });

scanner.render(onScanSuccess);
</script>

</body>
</html>
