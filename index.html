<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Refeições</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    #reader {
      width: 500px;
      height: 600px;
      margin: auto;
    }

    #contador {
      margin-top: 20px;
      font-size: 40px;
      font-weight: bold;
    }

    /* ALERTA CENTRAL */
    #alerta {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      padding: 20px 40px;
      font-size: 24px;
      border-radius: 10px;
      display: none;
      z-index: 999;
    }
  </style>
</head>

<body>

<h1>🍽 Controle de Refeições</h1>

<div id="reader"></div>

<div id="contador">0</div>

<div id="alerta"></div>

<script>
let registros = {};
let ultimoScan = {};
let total = 0;

const TEMPO_LIMITE = 3 * 60 * 1000;

function mostrarAlerta(msg) {
    let alerta = document.getElementById("alerta");
    alerta.innerText = msg;
    alerta.style.display = "block";

    setTimeout(() => {
        alerta.style.display = "none";
    }, 2000); // some em 2s
}

function onScanSuccess(decodedText) {
    try {
        let data = JSON.parse(decodedText);
        let matricula = data.MatriculaAluno;
        let agora = Date.now();

        if (ultimoScan[matricula]) {
            let tempoPassado = agora - ultimoScan[matricula];

            if (tempoPassado < TEMPO_LIMITE) {
                let restante = TEMPO_LIMITE - tempoPassado;

                let minutos = Math.floor(restante / 60000);

                mostrarAlerta(`⏳ Falta ${minutos} minuto(s)`);
                return;
            }
        }

        ultimoScan[matricula] = agora;

        if (!registros[matricula]) {
            registros[matricula] = 0;
        }

        registros[matricula]++;

        if (registros[matricula] > 2) {
            mostrarAlerta("❌ BLOQUEADO");
            return;
        }

        total++;
        document.getElementById("contador").innerText = total;

        mostrarAlerta("✅ Liberado");

    } catch (e) {
        mostrarAlerta("QR inválido");
    }
}

// scanner
let scanner = new Html5QrcodeScanner("reader", {
    fps: 10,
    qrbox: 250
});

scanner.render(onScanSuccess);
</script>

</body>
</html>
